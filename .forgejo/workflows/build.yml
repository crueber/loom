name: Build & push container

# Automated container builds for crueber/loom (mirrors push.sh):
# on push to main, build ./Dockerfile for linux/amd64,linux/arm64 and
# push git.packden.us/crueber/loom:latest + sha-<short-SHA>.
# On pull_request, build only (no push). Auth uses the built-in
# Forgejo token only; no extra secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Short SHA
        run: echo "SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Log in to Forgejo registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: git.packden.us
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            git.packden.us/crueber/loom:latest
            git.packden.us/crueber/loom:sha-${{ env.SHORT_SHA }}
