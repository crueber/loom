<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom</title>
<link rel="stylesheet" href="/styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4f2ec">
</head>
<body>
<header id="topbar">
  <div class="brand">loom</div>
  <nav id="boards" aria-label="Boards"></nav>
  <div class="boardctl" id="boardctl"></div>
  <div class="actions">
    <button class="i18n-slot" disabled title="Language picker (coming soon)">EN</button>

  </div>
</header>
<div id="creator"></div>
<main id="board"></main>
<script>window.__BOOTSTRAP_DATA__=/*__BOOTSTRAP_DATA__*/null;</script>

<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(function(){}); }
</script>

</html>
